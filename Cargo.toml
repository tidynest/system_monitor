# ========== Cargo.toml ========== #
[package]
name = "system_monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.52.0", features = ["full"] }
async-stream = "0.3.6"

# Date and time
chrono = "0.4.44"

# Web framework. Defaults minus `http2`: the server binds plain HTTP/1.1, and
# leaving it out keeps h2 (RUSTSEC-2026-0258, no 0.3 fix) out of the build.
actix-web = { version = "4.13.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-files = "0.6.10"

# Serialisation
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# System information
sysinfo = "0.38.4"

# Utilities
once_cell = "1.21.4"
env_logger = "0.11.10"
log = "0.4.29"
